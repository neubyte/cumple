<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmaciones cumple</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:#07111c;color:#fff;padding:20px
  }
  .card{
    width:min(100%,420px);padding:28px;border-radius:24px;text-align:center;
    background:#0e1d2b;border:1px solid rgba(255,255,255,.14)
  }
  .kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
  .count{font-size:4.2rem;font-weight:900;line-height:1;margin:18px 0 6px}
  .goal{font-size:1.15rem;opacity:.8}
  .bar{height:14px;background:#02070b;border-radius:999px;overflow:hidden;margin:24px 0 14px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#f4c316,#fff,#d71920);transition:width .4s}
  .status{font-size:.9rem;opacity:.62}
  button{
    margin-top:18px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;
    background:#f4c316;color:#07111c;cursor:pointer
  }
</style>
</head>
<body>
<main class="card">
  <div class="kicker">Cumple Camilo & Santiago</div>
  <div class="count"><span id="total">8</span><span style="font-size:1.7rem;opacity:.55"> / 30</span></div>
  <div class="goal">Faltan <strong id="faltan">22</strong> invitados</div>
  <div class="bar"><div id="barra"></div></div>
  <div class="status" id="estado">Actualizando…</div>
  <button id="actualizar" type="button">Actualizar</button>
</main>
<script>
const BASE=8, META=30;
const GET='https://abacus.jasoncameron.dev/get/cumple-cami-santi-20261004-7f3a9c2d/confirmados';

async function cargar(){
  const estado=document.getElementById('estado');
  estado.textContent='Actualizando…';
  let nuevos=0;
  try{
    const r=await fetch(GET+'?t='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const data=await r.json();
      nuevos=Number(data.value)||0;
      estado.textContent='Actualizado ahora';
    }else if(r.status===404){
      estado.textContent='Todavía no hay confirmaciones nuevas';
    }else{
      estado.textContent='No se pudo actualizar';
    }
  }catch(e){
    estado.textContent='No se pudo actualizar';
  }
  const total=BASE+nuevos;
  document.getElementById('total').textContent=total;
  document.getElementById('faltan').textContent=Math.max(META-total,0);
  document.getElementById('barra').style.width=Math.min((total/META)*100,100)+'%';
}
document.getElementById('actualizar').addEventListener('click',cargar);
cargar();
</script>
</body>
</html>
